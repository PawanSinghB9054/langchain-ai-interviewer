<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio — AI Interviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="grain"></div>

  <div class="app">

    <header class="header">
      <div class="on-air">
        <span class="on-air-dot"></span>
        <span class="on-air-text">ON AIR</span>
      </div>
      <h1>Studio<span class="dot">.</span></h1>
      <p class="tagline">Let’s start the practice interview — the AI recruiter will ask questions, give you a score, and provide feedback.</p>
    </header>

    <!-- SETUP SCREEN -->
    <section id="setup-screen" class="panel">
      <div class="panel-label">
        <span class="panel-index">Sc. 01</span>
        <span>Setup</span>
      </div>

      <div class="form-group">
        <label>Interview Type</label>
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="normal">
            <span class="mode-title">Normal</span>
            <span class="mode-sub">Open topic</span>
          </button>
          <button type="button" class="mode-btn" data-mode="pdf">
            <span class="mode-title">PDF Based</span>
            <span class="mode-sub">From document</span>
          </button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="topic">Topic</label>
          <input type="text" id="topic" placeholder="Python, DSA, HR Round...">
        </div>

        <div class="form-group">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium" selected>Medium</option>
            <option value="Hard">Hard</option>
            <option value="Extreme">Extreme</option>
          </select>
        </div>
      </div>

      <div class="form-group file-group" id="pdf-upload-group" style="display:none;">
        <label for="pdf-file">Reference Document</label>
        <label class="file-drop" id="file-drop-label">
          <input type="file" id="pdf-file" accept="application/pdf">
          <span id="file-drop-text">Click to upload PDF</span>
        </label>
      </div>

      <button id="start-btn" class="primary-btn">
        <span>Start Interview</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="setup-error" class="error-text"></div>
    </section>

    <!-- CHAT SCREEN -->
    <section id="chat-screen" class="panel chat-panel" style="display:none;">
      <div class="chat-header">
        <div class="chat-header-info">
          <span class="panel-index">Sc. 02</span>
          <div>
            <strong id="chat-topic"></strong>
            <span id="chat-diff" class="badge"></span>
          </div>
        </div>
        <button id="end-btn" class="secondary-btn">End</button>
      </div>

      <div id="chat-window" class="chat-window"></div>

      <div id="loading" class="loading" style="display:none;">
        <div class="waveform">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span>Interviewer likh raha hai...</span>
      </div>

      <div class="answer-box">
        <textarea id="answer-input" placeholder="Apna jawab yahan likhein..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" title="Send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9h13M10 3.5L15.5 9 10 14.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
